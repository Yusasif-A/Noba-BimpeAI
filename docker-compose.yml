# Three processes, one image. All three must be running for the demo to work:
# the API takes Meta's webhook and hands the call to LiveKit, and LiveKit then
# dispatches it to whichever agent the caller needs. With the telco agent down,
# a caller with no pending fraud alert reaches a room no worker ever joins, and
# the line simply rings out with nothing in the logs to explain it.
#
#   docker compose up -d --build
#   docker compose logs -f telco-agent
#
# Every port comes from .env. Compose reads that file for ${...} below, and
# env_file passes it into the containers themselves.

x-noba: &noba
  build:
    context: .
  image: noba:latest
  env_file: .env
  restart: unless-stopped
  # Host networking, so Compose never asks for a bridge network.
  #
  # These three talk outbound only - to LiveKit, to Meta, to the speech API -
  # and never to each other: dispatch between the API and the agents goes
  # through LiveKit, not over a local socket. So the project network Compose
  # creates by default was pure overhead, and on a shared host it is worse
  # than overhead. Docker allocates each network a subnet from a pool of about
  # thirty-one, and a server with other tenants on it can have none left:
  #
  #     all predefined address pools have been fully subnetted
  #
  # With host networking there is no allocation to fail. APP_PORT binds
  # straight to the host, which is what a public webhook wants anyway.
  network_mode: host
  # The agents keep long-lived websockets to LiveKit and to the speech API.
  # Docker's default 10s stop timeout cuts a live call off mid-sentence.
  stop_grace_period: 30s
  volumes:
    # Fraud alerts waiting for a customer to call back. On disk so that
    # rebuilding an image does not strand someone who was told to ring in.
    - noba-state:/app/state
  environment:
    PENDING_ALERTS_FILE: /app/state/pending_alerts.json

services:
  # Meta's WhatsApp webhook, the fraud trigger, and the simulated bank's REST
  # surface. This is the only service that needs to be reachable from outside.
  api:
    <<: *noba
    container_name: noba-api
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port ${APP_PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${APP_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The bank line: answers a customer ringing back about a fraud alert,
  # verifies them, and can freeze a card.
  bank-agent:
    <<: *noba
    container_name: noba-bank-agent
    command: ["python", "agent.py", "start"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${AGENT_HTTP_PORT:-8081}/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # The telco line, and the front door: it answers first, asks whether the
  # caller wants telecom or bank, and hands over to the bank line if they say
  # bank. An unknown caller still gets a useful conversation.
  telco-agent:
    <<: *noba
    container_name: noba-telco-agent
    command: ["python", "telco_agent.py", "start"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${TELCO_HTTP_PORT:-8082}/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  noba-state:
